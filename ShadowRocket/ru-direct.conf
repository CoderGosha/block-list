DOMAIN-SUFFIX,yastatic.net,DIRECT

# Из поддерживаемого списка itdoginfo/allow-domains (Russia/outside-raw.lst)
DOMAIN-SUFFIX,1018213540.rsc.cdn77.org,DIRECT
DOMAIN-SUFFIX,bitrix.info,DIRECT
DOMAIN-SUFFIX,showip.net,DIRECT
DOMAIN-SUFFIX,yandex.net,DIRECT

# ── 4. Российские домены целиком ─────────────────────────────────────
# Ozon, Wildberries, банки, госуслуги, маркетплейсы, операторы — всё сюда.
# Если какой-то .ru сайт заблокирован в РФ и нужен через туннель —
# добавьте его DOMAIN-SUFFIX,<домен>,PROXY в блок 2, он сработает раньше.
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,su,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT

# ── 5. Apple напрямую ────────────────────────────────────────────────
# Пуш, iCloud и активация через туннель работают, но добавляют задержку
# и иногда триггерят проверки Apple. Уберите блок, если хотите и их в туннель.
DOMAIN-SUFFIX,apple.com,DIRECT
DOMAIN-SUFFIX,icloud.com,DIRECT
DOMAIN-SUFFIX,icloud-content.com,DIRECT
DOMAIN-SUFFIX,cdn-apple.com,DIRECT
DOMAIN-SUFFIX,aaplimg.com,DIRECT
DOMAIN-SUFFIX,mzstatic.com,DIRECT
DOMAIN-SUFFIX,apple-cloudkit.com,DIRECT
DOMAIN-SUFFIX,me.com,DIRECT
DOMAIN-SUFFIX,apple.news,DIRECT
DOMAIN-SUFFIX,appstore.com,DIRECT

# ── 6. Всё, что хостится в России ────────────────────────────────────
# Ловит сервисы по IP и те, что не попали в списки выше.
GEOIP,RU,DIRECT

# ── 7. Всё остальное — в туннель ─────────────────────────────────────
FINAL,PROXY

[Host]
localhost = 127.0.0.1
