IP-CIDR,91.108.56.0/22,PROXY,no-resolve
IP-CIDR,91.105.192.0/23,PROXY,no-resolve
IP-CIDR,185.76.151.0/24,PROXY,no-resolve
IP-CIDR,95.161.64.0/20,PROXY,no-resolve
IP-CIDR,5.28.192.0/21,PROXY,no-resolve
IP-CIDR,194.221.250.50/32,PROXY,no-resolve
IP-CIDR,142.252.58.106/32,PROXY,no-resolve
IP-CIDR,172.121.110.168/32,PROXY,no-resolve
IP-CIDR,172.121.110.90/32,PROXY,no-resolve

# ── 3. Российские сервисы на зарубежных доменах ──────────────────────
# Общее правило .ru ниже их не поймает, поэтому перечислены поимённо.
DOMAIN-SUFFIX,avito.st,DIRECT
DOMAIN-SUFFIX,mycdn.me,DIRECT
DOMAIN-SUFFIX,ozon.travel,DIRECT
DOMAIN-SUFFIX,ozonusercontent.com,DIRECT
DOMAIN-SUFFIX,sberbank.com,DIRECT
DOMAIN-SUFFIX,userapi.com,DIRECT
DOMAIN-SUFFIX,vk-cdn.net,DIRECT
DOMAIN-SUFFIX,vk.com,DIRECT
